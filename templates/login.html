{% extends "base.html" %}

{% block title %}Sign in — Spendly{% endblock %}

{% block content %}

<section class="auth-section">
    <canvas id="vault-canvas" class="vault-canvas" aria-hidden="true"></canvas>

    <div class="auth-container">

        <h1 class="vault-eyebrow">Sign in to Spendly</h1>

        <div class="auth-card">
            <div class="identity-chip">
                <span class="identity-avatar" aria-hidden="true">TY</span>
                <span class="identity-name">Tarun Yadav</span>
                <svg class="identity-lock" viewBox="0 0 24 24" width="14" height="14" fill="none"
                     stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
                     aria-hidden="true">
                    <rect x="5" y="11" width="14" height="9" rx="2"></rect>
                    <path d="M8 11V7a4 4 0 0 1 8 0v4"></path>
                </svg>
            </div>

            {% if error %}
            <div class="auth-error">{{ error }}</div>
            {% endif %}

            <form method="POST" action="/login">
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="password-field">
                        <input type="password" id="password" name="password"
                               class="form-input" placeholder="Your password"
                               required autofocus>
                        <button type="button" class="password-toggle" id="password-toggle"
                                aria-label="Show password">
                            <svg class="icon-eye" viewBox="0 0 24 24" width="18" height="18" fill="none"
                                 stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                            <svg class="icon-eye-off" viewBox="0 0 24 24" width="18" height="18" fill="none"
                                 stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"
                                 hidden>
                                <path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a20.6 20.6 0 0 1 5.06-5.94"></path>
                                <path d="M9.9 4.24A10.6 10.6 0 0 1 12 4c7 0 11 7 11 7a20.6 20.6 0 0 1-3.22 4.39"></path>
                                <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"></path>
                                <path d="M1 1l22 22"></path>
                            </svg>
                        </button>
                    </div>
                </div>
                <button type="submit" class="btn-submit">Sign in</button>
            </form>
        </div>

    </div>
</section>

{% endblock %}

{% block scripts %}
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="{{ url_for('static', filename='js/login.js') }}"></script>
{% endblock %}
