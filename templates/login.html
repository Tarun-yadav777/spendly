{% extends "base.html" %}

{% block title %}Sign in — Spendly{% endblock %}

{% block content %}

<section class="login-section">
    <div class="login-orb login-orb-1" aria-hidden="true"></div>
    <div class="login-orb login-orb-2" aria-hidden="true"></div>
    <div class="login-grid" aria-hidden="true"></div>

    <div class="login-container">
        <div class="login-card">

            <button type="button" id="theme-toggle" class="login-brand-row" aria-label="Toggle dark mode">
                <span class="login-brand-icon" aria-hidden="true">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                        <path d="M8 2L14 5.5V10.5L8 14L2 10.5V5.5L8 2Z" fill="white" fill-opacity="0.9"/>
                        <path d="M8 5L11 6.75V10.25L8 12L5 10.25V6.75L8 5Z" fill="white" fill-opacity="0.4"/>
                    </svg>
                </span>
                <span class="login-brand-text">Spendly</span>
            </button>

            <div class="login-heading-group">
                <h1 class="login-heading">Welcome back, <em>Tarun.</em></h1>
                <p class="login-subtitle">Enter your password to unlock your dashboard.</p>
            </div>

            <div class="login-divider"></div>

            {% if error %}
            <div class="login-error">{{ error }}</div>
            {% endif %}

            <form method="POST" action="/login" class="login-form" id="login-form">
                <div class="login-field">
                    <div class="login-field-row">
                        <label for="password">Password</label>
                        <button type="button" class="login-forgot">Forgot password?</button>
                    </div>
                    <div class="login-input-wrap">
                        <input type="password" id="password" name="password"
                               class="login-input" placeholder="Enter your password"
                               autocomplete="current-password" required autofocus>
                        <button type="button" class="login-toggle" id="password-toggle"
                                aria-label="Show password">
                            <svg class="icon-eye" viewBox="0 0 24 24" width="16" height="16" fill="none"
                                 stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                            <svg class="icon-eye-off" viewBox="0 0 24 24" width="16" height="16" fill="none"
                                 stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                                 hidden>
                                <path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"></path>
                                <path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"></path>
                                <path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"></path>
                                <path d="m2 2 20 20"></path>
                            </svg>
                        </button>
                    </div>
                </div>

                <button type="submit" class="login-submit" id="login-submit">
                    <span class="login-submit-label">
                        <span>Unlock dashboard</span>
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M5 12h14"></path>
                            <path d="m12 5 7 7-7 7"></path>
                        </svg>
                    </span>
                    <span class="login-submit-loading" hidden>
                        <svg class="login-spinner" width="16" height="16" viewBox="0 0 24 24" fill="none">
                            <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-opacity="0.3" stroke-width="3"></circle>
                            <path d="M12 2a10 10 0 0 1 10 10" stroke="currentColor" stroke-width="3" stroke-linecap="round"></path>
                        </svg>
                        <span>Unlocking…</span>
                    </span>
                </button>
            </form>

            <p class="login-footer">Secured with end-to-end encryption</p>

        </div>
    </div>
</section>

{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/login.js') }}"></script>
{% endblock %}
