<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        (function () {
            var theme = localStorage.getItem('theme');
            if (theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
        })();
    </script>
    <title>{% block title %}Spendly{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block head %}{% endblock %}
</head>
<body>

    {% if request.endpoint != 'login' %}
    <nav class="navbar">
        <div class="nav-inner">
            <button type="button" id="theme-toggle" class="nav-brand" aria-label="Toggle dark mode">
                <span class="brand-icon-box">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                        <path d="M8 2C8 2 3 5 3 9C3 11.76 5.24 14 8 14C10.76 14 13 11.76 13 9C13 5 8 2 8 2Z" fill="white" fill-opacity="0.9"/>
                        <circle cx="8" cy="9" r="2.5" fill="white" fill-opacity="0.3"/>
                        <circle cx="8" cy="9" r="1.2" fill="white"/>
                    </svg>
                </span>
                <span class="brand-name">Spendly</span>
            </button>
            <div class="nav-links">
                {% if session.get('logged_in') %}
                <a href="{{ url_for('logout') }}">Sign out</a>
                {% else %}
                <a href="{{ url_for('login') }}" class="nav-cta">Sign in</a>
                {% endif %}
            </div>
        </div>
    </nav>
    {% endif %}

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
